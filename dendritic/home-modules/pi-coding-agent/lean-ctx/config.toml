# Managed lean-ctx global config (live-edit via Home Manager symlink).
# Path: ~/.config/lean-ctx/config.toml
# Agents may run `lean-ctx allow <cmd>` — pi-permission-system prompts you for approval.
# WARNING: `lean-ctx allow` round-trips this file (TOML value round-trip) and strips comments/formatting.
# For permanent additions, edit this file and run `home-manager switch`.

shell_allowlist_extra = [
  "engram",
  "glab",
  "direnv",
  "pi",
  "time",
  "sh",
  "bash",
  "nu",
  "nix-prefetch-git",
  "act",
  "docker",
  "colima",
  "open",
  "podman",
  "tesseract",
  "pdftotext",
  "codegraph",
  "wt",
  "sesh",
  "tmux",
  "jq",
  "droast",
  "ssh",
  "ping",
  "nc",
  "tailscale",
  "dig",
  "timeout",
  "break",
  "nix-store",
  "journalctl",
  "hyprctl",
  "devenv",
]
